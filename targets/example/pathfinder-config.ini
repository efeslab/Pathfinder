[general]
output_dir_tmpl = {{ build_root }}/example
verbose = yes
pm_fs_path = ../fs_path
max_nproc = 80
parallelize = yes
sanity_test = no
fsync_test = no
count_crash_state = no
mode = posix

[trace]
verbose = yes
cmd_tmpl = {{ pwd }}/workload {{ pmdir }}

[test]
checker_tmpl = {{ pwd }}/checker {{ pmdir }}
timeout = 30